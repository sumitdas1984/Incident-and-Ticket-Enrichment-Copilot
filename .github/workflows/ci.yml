name: ci
on: [push, pull_request]
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy apps rag connectors
      - run: uv run pytest -ra