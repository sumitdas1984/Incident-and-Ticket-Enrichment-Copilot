[project]
name = "incident-and-ticket-enrichment-copilot"
version = "0.1.0"
description = "AI copilot that enriches industrial incidents via MCP + RAG."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Sumit Das" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "pydantic>=2.5",
    "structlog>=24.4",
    # MCP protocol SDK — used by the candidate-developed MCP server in
    # `mcp-servers/alarm-management/`. FastMCP gives us typed tool
    # registration + JSON Schema generation from Pydantic models; rolling
    # our own JSON-RPC framing for MCP is out of scope for the timebox.
    "mcp>=1.0",
    # Async HTTP client used by the MCP server's readiness probe and
    # (in Feature 3.2) by every tool handler when it calls the alarm-api.
    "httpx>=0.27",
    # Bounded exponential-backoff retry layer around AlarmApiClient
    # (Feature 3.3). Retries only on retryable status codes and
    # documented transport exceptions; the four tool handlers stay
    # unchanged because the policy wraps ``get_json`` /
    # ``post_json`` internally.
    "tenacity>=8.2",
    # Embedding model for RAG ingestion (Feature 4.1). Pinned to a
    # small, CPU-friendly model so the corpus can be ingested in a
    # clean container without GPU / cloud credentials. The library
    # pulls the actual weights on first use; the CLI defaults to a
    # deterministic embedder so a fresh checkout ingests without
    # any network access.
    "sentence-transformers>=3.0",
    # ``torch`` is a transitive dep of sentence-transformers;
    # declaring it explicitly so the lock file pins a known-good
    # version per platform. The deterministic embedder path
    # never imports torch, so the cost is paid only when the
    # real model is wired in.
    "torch>=2.1",
    # PyYAML for the front-matter parser in the RAG loader.
    # ``python-frontmatter`` would also work, but the front-matter
    # grammar is small enough that a hand-rolled YAML reader
    # keeps the dep footprint down.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx2>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "apps",
    "apps.backend",
    "apps.frontend",
    "core",
    "mcp_servers",
    "mcp_servers.alarm_management",
    "mcp_servers.optional_secondary_server",
    "rag",
    "rag.ingestion",
    "rag.retrieval",
    "rag.tests",
    "connectors",
    "connectors.alarm_api",
]

[tool.setuptools.package-dir]
"mcp_servers" = "mcp-servers"
"mcp_servers.alarm_management" = "mcp-servers/alarm-management"
"mcp_servers.optional_secondary_server" = "mcp-servers/optional-secondary-server"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
markers = [
    "integration: requires running docker-compose stack",
    "e2e: full end-to-end scenario, slow",
    "slow_embeddings: requires the real sentence-transformers model (downloads weights on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# mcp-servers/ directory uses hyphens (per the brief); the Python package
# is aliased via [tool.setuptools.package-dir] to mcp_servers. The
# directory names are filesystem paths, not Python module identifiers,
# so suppress pep8-naming's N999 there.
"mcp-servers/**" = ["N999"]
# `tools.py` uses Pydantic v2's documented `Field(default=None,
# description=...)` idiom on tool-handler kwargs. B008's "do not
# perform function call in argument defaults" rule is for mutable
# defaults; Pydantic Field() returns a sentinel that the framework
# reads at schema-build time, so the rule doesn't apply. The MCP
# SDK's flat-kwargs shape depends on Field() being in the signature.
"mcp-servers/alarm-management/tools.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
# mcp-servers/ directory uses hyphens (per the brief); the Python package
# is aliased via [tool.setuptools.package-dir] to mcp_servers. Mypy does
# not understand that alias, so skip type-checking the placeholders for
# now. Real code lands in Epic 3, at which point we'll add explicit
# mypy_path handling.
exclude = ["mcp-servers/"]

[[tool.mypy.overrides]]
# structlog uses very dynamic types in its processors; the third-party
# type stubs are too strict for our usage. Treat as untyped.
module = "structlog.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # fastapi.testclient -> starlette.testclient requires httpx2 in newer
    # starlette releases. Without it, `uv run pytest` fails at collection
    # with: RuntimeError: The starlette.testclient module requires the httpx2
    # package to be installed.
    "httpx2>=0.27",
]

[tool.uv]
package = true
managed = true
default-groups = ["dev"]